name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            Tools/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved', 'Tools/Package.swift', 'Tools/Package.resolved') }}
      - name: Run canonical gate
        run: make ci
